<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Подключение BME280 к XIAO ESP32-C6</title>
  <rect x="0" y="0" width="760" height="600" rx="16" fill="#ffffff"/>

  <!-- XIAO ESP32-C6, вид сверху, USB-C вверх -->
  <rect x="355" y="66" width="60" height="30" rx="6" fill="#9ca3af"/>
  <text x="385" y="86" font-size="12" text-anchor="middle" fill="#111827">USB-C</text>
  <rect x="300" y="90" width="170" height="290" rx="14" fill="#1f2937"/>
  <rect x="330" y="132" width="110" height="104" rx="6" fill="#c9ced6"/>
  <text x="385" y="190" font-size="12" text-anchor="middle" fill="#374151">ESP32-C6</text>
  <rect x="316" y="100" width="20" height="16" rx="3" fill="#e5e7eb"/>
  <text x="326" y="112" font-size="10" text-anchor="middle" fill="#111827">B</text>
  <rect x="434" y="100" width="20" height="16" rx="3" fill="#e5e7eb"/>
  <text x="444" y="112" font-size="10" text-anchor="middle" fill="#111827">R</text>
  <text x="385" y="368" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">XIAO ESP32-C6</text>

  <!-- Левый ряд: D0…D6 -->
  <g font-size="12" fill="#ffffff">
    <text x="312" y="124">D0</text>
    <text x="312" y="162">D1</text>
    <text x="312" y="200">D2</text>
    <text x="312" y="238">D3</text>
    <text x="312" y="276" font-weight="700">D4 · SDA</text>
    <text x="312" y="314" font-weight="700">D5 · SCL</text>
    <text x="312" y="352">D6</text>
  </g>
  <g fill="#f2c94c">
    <circle cx="300" cy="120" r="6"/><circle cx="300" cy="158" r="6"/><circle cx="300" cy="196" r="6"/>
    <circle cx="300" cy="234" r="6"/><circle cx="300" cy="272" r="7"/><circle cx="300" cy="310" r="7"/>
    <circle cx="300" cy="348" r="6"/>
  </g>

  <!-- Правый ряд: 5V, GND, 3V3, D10…D7 -->
  <g font-size="12" fill="#ffffff" text-anchor="end">
    <text x="458" y="124">5V</text>
    <text x="458" y="162" font-weight="700">GND</text>
    <text x="458" y="200" font-weight="700">3V3</text>
    <text x="458" y="238">D10</text>
    <text x="458" y="276">D9</text>
    <text x="458" y="314">D8</text>
    <text x="458" y="352">D7</text>
  </g>
  <g fill="#f2c94c">
    <circle cx="470" cy="120" r="6"/><circle cx="470" cy="158" r="7"/><circle cx="470" cy="196" r="7"/>
    <circle cx="470" cy="234" r="6"/><circle cx="470" cy="272" r="6"/><circle cx="470" cy="310" r="6"/>
    <circle cx="470" cy="348" r="6"/>
  </g>

  <!-- Провода -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300,272 H255 V450 H330 V470" stroke="#f59e0b"/>   <!-- D4 → SDA -->
    <path d="M300,310 H270 V435 H365 V470" stroke="#2563eb"/>   <!-- D5 → SCL -->
    <path d="M470,158 H515 V435 H405 V470" stroke="#111827"/>   <!-- GND → GND -->
    <path d="M470,196 H500 V450 H440 V470" stroke="#dc2626"/>   <!-- 3V3 → VIN -->
  </g>

  <!-- BME280 -->
  <rect x="300" y="470" width="170" height="96" rx="8" fill="#5b3c9e"/>
  <g fill="#f2c94c">
    <circle cx="330" cy="476" r="6"/><circle cx="365" cy="476" r="6"/>
    <circle cx="405" cy="476" r="6"/><circle cx="440" cy="476" r="6"/>
  </g>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="330" y="498">SDA</text>
    <text x="365" y="498">SCL</text>
    <text x="405" y="498">GND</text>
    <text x="440" y="498">VIN</text>
  </g>
  <rect x="371" y="512" width="28" height="28" rx="3" fill="#c9ced6"/>
  <text x="385" y="558" font-size="12" text-anchor="middle" fill="#ffffff">BME280</text>

  <!-- Легенда -->
  <g font-size="13" fill="#111827">
    <text x="560" y="110" font-weight="700">Провода</text>
    <line x1="560" y1="132" x2="590" y2="132" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="137">3V3 → VIN</text>
    <line x1="560" y1="160" x2="590" y2="160" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="165">GND → GND</text>
    <line x1="560" y1="188" x2="590" y2="188" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="193">D4 → SDA</text>
    <line x1="560" y1="216" x2="590" y2="216" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="221">D5 → SCL</text>
  </g>

  <!-- Аккумулятор: XIAO вид снизу (ряды ножек меняются местами) -->
  <text x="560" y="250" font-size="13" font-weight="700" fill="#111827">Аккумулятор (опционально)</text>
  <text x="560" y="266" font-size="11" fill="#6b7280">XIAO вид снизу, USB-C вверх</text>
  <rect x="595" y="276" width="30" height="16" rx="4" fill="#9ca3af"/>
  <rect x="560" y="288" width="100" height="148" rx="10" fill="#1f2937"/>
  <g font-size="8" fill="#9ca3af">
    <text x="568" y="303">5V</text><text x="568" y="325">GND</text><text x="568" y="347">3V3</text>
    <text x="568" y="369">D10</text><text x="568" y="391">D9</text><text x="568" y="413">D8</text>
    <text x="568" y="435">D7</text>
    <text x="652" y="303" text-anchor="end">D0</text><text x="652" y="325" text-anchor="end">D1</text>
    <text x="652" y="347" text-anchor="end">D2</text><text x="652" y="369" text-anchor="end">D3</text>
    <text x="652" y="391" text-anchor="end">D4</text><text x="652" y="413" text-anchor="end">D5</text>
    <text x="652" y="435" text-anchor="end">D6</text>
  </g>
  <rect x="588" y="398" width="16" height="12" rx="2" fill="#f2c94c"/>
  <rect x="616" y="398" width="16" height="12" rx="2" fill="#f2c94c"/>
  <text x="596" y="394" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">BAT−</text>
  <text x="624" y="394" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">BAT+</text>

  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M700,522 H718 V462 H624 V410" stroke="#dc2626"/>   <!-- + → BAT+ -->
    <path d="M572,522 H548 V462 H596 V410" stroke="#111827"/>   <!-- − → BAT− -->
  </g>
  <rect x="572" y="504" width="120" height="36" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <rect x="692" y="514" width="8" height="16" rx="2" fill="#9ca3af"/>
  <text x="632" y="527" font-size="12" font-weight="700" text-anchor="middle" fill="#111827">Li-ion 3,7 В</text>
  <text x="684" y="500" font-size="13" font-weight="700" fill="#dc2626">+</text>
  <text x="578" y="500" font-size="13" font-weight="700" fill="#111827">−</text>
  <text x="560" y="562" font-size="11" fill="#6b7280">один элемент 3,7 В, с защитой</text>
  <text x="560" y="577" font-size="11" fill="#6b7280">проверить полярность</text>

  <text x="40" y="40" font-size="16" font-weight="700" fill="#111827">Подключение BME280</text>
  <text x="40" y="60" font-size="12" fill="#6b7280">XIAO вид сверху, USB-C вверх</text>
</svg>
