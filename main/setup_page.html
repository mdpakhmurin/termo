<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Termo - настройка</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="card">
        <nav class="tabs">
            <a class="tab active" href="/">Wi-Fi</a>
            <a class="tab" href="/mqtt">MQTT</a>
        </nav>

        <div class="logo">🌡️</div>
        <h1>Настройка термометра</h1>
        <p class="hint">Выбери домашнюю сеть Wi-Fi.</p>

        <p class="saved" id="saved" hidden>
            ✓ Сохранена сеть <b id="saved-ssid"></b><br>
            Пароль сохранён
        </p>

        <form id="form" method="POST" action="/save_wifi">
            <div class="label-row">
                <label for="ssid">Сеть</label>
                <a class="refresh" href="#" onclick="loadWifi(); return false;">Обновить список</a>
            </div>
            <select id="networks" onchange="pickNetwork()">
                <option value="" disabled selected>Поиск сетей...</option>
            </select>
            <input class="manual" id="ssid" name="ssid" placeholder="Имя сети" required oninput="onSsidTyped()">

            <div class="label-row">
                <label for="password">Пароль</label>
            </div>
            <div class="password">
                <input id="password" name="password" type="password" placeholder="Пароль от Wi-Fi" required minlength="8" maxlength="63">
                <button type="button" class="toggle" onclick="togglePassword()" aria-label="Показать пароль">👁</button>
            </div>

            <button class="submit" id="submit">Сохранить</button>
            <p class="error" id="error" hidden></p>
        </form>

        <form method="POST" action="/finish">
            <button class="finish" id="finish" disabled>Завершить настройку</button>
        </form>
        <p class="hint finish-hint" id="finish-hint"></p>
    </div>

    <script>
        var wifiSaved = false;
        var mqttSaved = false;

        function updateFinish() {
            var missing = [];
            if (!wifiSaved) missing.push("Wi-Fi");
            if (!mqttSaved) missing.push("MQTT");

            document.getElementById("finish").disabled = missing.length > 0;

            var hint = document.getElementById("finish-hint");
            hint.hidden = missing.length === 0;
            hint.textContent = "Чтобы завершить, сохраните " + missing.join(" и ");
        }

        function signalBars(rssi) {
            if (rssi > -55) return "▂▄▆█";
            if (rssi > -65) return "▂▄▆";
            if (rssi > -75) return "▂▄";
            return "▂";
        }

        function loadWifi() {
            var select = document.getElementById("networks");
            select.length = 1;
            select.selectedIndex = 0;
            select.options[0].text = "Поиск сетей...";

            fetch("/api/wifi")
                .then(function (response) { return response.json(); })
                .then(showWifi)
                .catch(function () {
                    select.options[0].text = "Не удалось получить список";
                });
        }

        function showSavedWifi(ssid) {
            document.getElementById("saved-ssid").textContent = ssid;
            document.getElementById("saved").hidden = false;
            wifiSaved = true;
            updateFinish();
        }

        function showWifi(state) {
            if (state.saved_ssid) {
                showSavedWifi(state.saved_ssid);

                var ssidInput = document.getElementById("ssid");
                if (!ssidInput.value) {
                    ssidInput.value = state.saved_ssid;
                }
            }

            // Найденные сети. new Option сам защищает от «вредных» имён — экранировать не нужно
            var select = document.getElementById("networks");
            state.networks.forEach(function (network) {
                var label = network.ssid + "  " + signalBars(network.rssi) + (network.secured ? " 🔒" : "");
                select.add(new Option(label, network.ssid));
            });
            select.options[0].text = state.networks.length > 0 ? "Выбрать из найденных…" : "Сети не найдены";
        }

        function loadStatus() {
            fetch("/api/status")
                .then(function (response) { return response.json(); })
                .then(function (status) {
                    wifiSaved = status.wifi_saved;
                    mqttSaved = status.mqtt_saved;
                    updateFinish();
                });
        }

        document.getElementById("form").addEventListener("submit", function (event) {
            event.preventDefault();

            var form = event.target;
            var data = new URLSearchParams(new FormData(form));
            var fields = form.querySelectorAll("input, select, button");
            var button = document.getElementById("submit");
            var error = document.getElementById("error");

            fields.forEach(function (field) { field.disabled = true; });
            button.textContent = "Сохранение...";
            error.hidden = true;

            fetch(form.action, { method: "POST", body: data })
                .then(function (response) {
                    return response.json().then(function (result) {
                        if (!response.ok) {
                            throw new Error(result.error);
                        }
                        showSavedWifi(document.getElementById("ssid").value);
                    });
                })
                .catch(function (e) {
                    error.textContent = "Не удалось сохранить: " + (e instanceof SyntaxError ? "плата не ответила" : e.message);
                    error.hidden = false;
                })
                .finally(function () {
                    fields.forEach(function (field) { field.disabled = false; });
                    button.textContent = "Сохранить";
                });
        });

        updateFinish();
        loadStatus();
        loadWifi();

        function pickNetwork() {
            document.getElementById("ssid").value = document.getElementById("networks").value;
            document.getElementById("password").focus();
        }

        function onSsidTyped() {
            var select = document.getElementById("networks");
            if (select.value !== document.getElementById("ssid").value) {
                select.selectedIndex = 0;
            }
        }

        function togglePassword() {
            var input = document.getElementById("password");
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
