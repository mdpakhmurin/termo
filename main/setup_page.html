<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Termo - настройка</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="card">
        <div class="logo">🌡️</div>
        <h1>Настройка термометра</h1>
        <p class="hint">Выбери домашнюю сеть Wi-Fi.</p>

        <p class="saved" id="saved" hidden>
            ✓ Сохранена сеть <b id="saved-ssid"></b><br>
            Пароль сохранён
        </p>

        <form method="POST" action="/save_wifi" onsubmit="onSaving()">
            <div class="label-row">
                <label for="ssid">Сеть</label>
                <a class="refresh" href="#" onclick="loadWifi(); return false;">Обновить список</a>
            </div>
            <select id="networks" onchange="pickNetwork()">
                <option value="" disabled selected>Ищу сети…</option>
            </select>
            <input class="manual" id="ssid" name="ssid" placeholder="Имя сети" required oninput="onSsidTyped()">

            <div class="label-row">
                <label for="password">Пароль</label>
            </div>
            <div class="password">
                <input id="password" name="password" type="password" placeholder="Пароль от Wi-Fi" required minlength="8" maxlength="63">
                <button type="button" class="toggle" onclick="togglePassword()" aria-label="Показать пароль">👁</button>
            </div>

            <button class="submit" id="submit">Сохранить</button>
        </form>

        <a class="nav" href="/mqtt">
            <span>MQTT</span>
            <span class="nav-status"><span id="mqtt-status">…</span> →</span>
        </a>

        <form method="POST" action="/finish">
            <button class="finish" id="finish" disabled>Завершить настройку</button>
        </form>
    </div>

    <script>
        var wifiSaved = false;
        var mqttSaved = false;

        function updateFinish() {
            document.getElementById("finish").disabled = !(wifiSaved && mqttSaved);
        }

        function signalBars(rssi) {
            if (rssi > -55) return "▂▄▆█";
            if (rssi > -65) return "▂▄▆";
            if (rssi > -75) return "▂▄";
            return "▂";
        }

        function loadWifi() {
            var select = document.getElementById("networks");
            select.length = 1; 
            select.selectedIndex = 0;
            select.options[0].text = "Ищу сети…";

            fetch("/api/wifi")
                .then(function (response) { return response.json(); })
                .then(showWifi)
                .catch(function () {
                    select.options[0].text = "Не удалось получить список";
                });
        }

        function showWifi(state) {
            if (state.saved_ssid) {
                document.getElementById("saved-ssid").textContent = state.saved_ssid;
                document.getElementById("saved").hidden = false;
                wifiSaved = true;
                updateFinish();

                var ssidInput = document.getElementById("ssid");
                if (!ssidInput.value) {
                    ssidInput.value = state.saved_ssid;
                }
            }

            // Найденные сети. new Option сам защищает от «вредных» имён — экранировать не нужно
            var select = document.getElementById("networks");
            state.networks.forEach(function (network) {
                var label = network.ssid + "  " + signalBars(network.rssi) + (network.secured ? " 🔒" : "");
                select.add(new Option(label, network.ssid));
            });
            select.options[0].text = state.networks.length > 0 ? "Выбрать из найденных…" : "Сети не найдены";
        }

        function loadMqtt() {
            fetch("/api/mqtt")
                .then(function (response) { return response.json(); })
                .then(function (settings) {
                    mqttSaved = settings.uri !== "";
                    document.getElementById("mqtt-status").textContent = mqttSaved ? "сохранён" : "не настроен";
                    updateFinish();
                });
        }

        loadWifi();
        loadMqtt();

        function pickNetwork() {
            document.getElementById("ssid").value = document.getElementById("networks").value;
            document.getElementById("password").focus();
        }

        function onSsidTyped() {
            var select = document.getElementById("networks");
            if (select.value !== document.getElementById("ssid").value) {
                select.selectedIndex = 0;
            }
        }

        function togglePassword() {
            var input = document.getElementById("password");
            input.type = input.type === "password" ? "text" : "password";
        }

        function onSaving() {
            var button = document.getElementById("submit");
            button.disabled = true;
            button.textContent = "Сохранение...";
        }
    </script>
</body>
</html>
